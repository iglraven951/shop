<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Vendedor - DiscoveryShop</title>
    <link rel="stylesheet" href="css/chat-vendor.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <button class="back-btn" id="back-btn" onclick="goBack()">← Volver</button>
            <div class="header-title">
                <h1 id="seller-name">Cargando...</h1>
                <p id="seller-location">📍 Ubicación</p>
            </div>
            <div class="header-rating">
                <span id="seller-rating">⭐ 4.8</span>
                <span id="seller-sales">145 ventas</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sección Chat -->
        <section class="chat-section">
            <div class="chat-header">
                <h2>Conversación</h2>
            </div>

            <div class="messages-container" id="messages-container">
                <!-- Se llenan dinámicamente -->
            </div>

            <div class="chat-input-area">
                <input
                    type="text"
                    id="chat-input"
                    class="chat-input"
                    placeholder="Escribe tu mensaje..."
                    autocomplete="off"
                >
                <button class="send-btn" id="send-btn">
                    Enviar
                </button>
            </div>
        </section>

        <!-- Sección Producto -->
        <aside class="product-section">
            <!-- Producto Info -->
            <div class="product-card">
                <img id="product-image" src="" alt="Producto" class="product-image">
                <div class="product-info">
                    <h3 id="product-title">Nombre del Producto</h3>
                    <p class="product-price" id="product-price">S/ 0.00</p>
                    <p class="product-description" id="product-description">Descripción...</p>
                    <div class="product-meta">
                        <span id="product-category">Categoría</span>
                        <span id="product-stock">Stock: 5</span>
                    </div>
                </div>
            </div>

            <!-- Información del Vendedor -->
            <div class="vendor-info">
                <h3>Información del Vendedor</h3>
                <div class="vendor-details">
                    <p><strong id="vendor-name">Nombre Vendedor</strong></p>
                    <p id="vendor-rating-detail">⭐ 4.8 (145 ventas)</p>
                    <p id="vendor-location-detail">📍 Ubicación</p>
                    <p id="vendor-username" style="font-size: 12px; color: #a0a0a0;">@usuario</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Scripts -->
    <script>
        // Función de volver
        function goBack() {
            console.log('🔙 goBack() llamado');
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/index.html';
            }
        }
    </script>

    <script src="js/config.js"></script>
    <script src="js/ui.js" type="module"></script>
    <script src="js/chat-vendedor-v2.js"></script>
</body>
</html>
