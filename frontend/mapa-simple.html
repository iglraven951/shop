<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Simple - DiscoveryShop</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
            color: #3b82f6;
        }
        .map-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 400px;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .status {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            background: #2a2a2a;
        }
        .success {
            color: #10b981;
            border-left: 4px solid #10b981;
            padding-left: 10px;
        }
        .error {
            color: #ef4444;
            border-left: 4px solid #ef4444;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Mapa Simple - DiscoveryShop</h1>

        <div class="map-container">
            <div id="map"></div>
        </div>

        <div class="info">
            <h3>Estado del Sistema:</h3>
            <div id="status"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const statusDiv = document.getElementById('status');

        function addStatus(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = msg;
            statusDiv.appendChild(div);
            console.log(msg);
        }

        // Esperar a que todo cargue
        window.addEventListener('load', () => {
            addStatus('✓ Página cargada', 'success');

            // Verificar Leaflet
            if (typeof L === 'undefined') {
                addStatus('❌ Leaflet no está disponible', 'error');
                return;
            }
            addStatus('✓ Leaflet disponible', 'success');

            // Crear mapa
            try {
                const map = L.map('map', {
                    center: [-16.3972, -71.5350],
                    zoom: 14,
                    zoomControl: true
                });
                addStatus('✓ Mapa creado', 'success');

                // Tile layer
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                addStatus('✓ Capa de mapa agregada', 'success');

                // Marcador
                const redIcon = L.icon({
                    iconUrl: 'data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 41"><path d="M12.5 0C7.3 0 3 4.3 3 9.5c0 7.6 9.5 31 9.5 31s9.5-23.4 9.5-31C22 4.3 17.7 0 12.5 0z" fill="%23ef4444"/></svg>',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41]
                });

                const marker = L.marker([-16.3972, -71.5350], {
                    icon: redIcon
                }).addTo(map);
                addStatus('✓ Marcador agregado', 'success');

                // Popup
                marker.bindPopup('Arequipa Centro, Perú').openPopup();
                addStatus('✓ Popup agregado', 'success');

                // Ajustar tamaño
                setTimeout(() => {
                    map.invalidateSize();
                    addStatus('✓ Tamaño ajustado', 'success');
                }, 300);

            } catch (e) {
                addStatus(`❌ Error: ${e.message}`, 'error');
            }
        });
    </script>
</body>
</html>
