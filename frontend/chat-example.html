<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscoveryShop - Chat em Tempo Real</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .connection-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        .connection-status.disconnected {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(76, 175, 80, 0);
            }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 10px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.received .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 10px 10px 10px 0;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px 10px 0 10px;
        }

        .system-message {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding: 10px;
            font-style: italic;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 15px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: bounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            50% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .chat-input {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .chat-input button:hover {
            transform: scale(1.05);
        }

        .chat-input button:active {
            transform: scale(0.95);
        }

        .setup-panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .setup-panel h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .setup-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .setup-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }

        .setup-group button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .setup-group button:hover {
            background: #764ba2;
        }

        .error {
            background: #f44336;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .success {
            background: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div>
        <div class="setup-panel">
            <h2>Configuração do Chat</h2>
            <div id="error-message" class="error" style="display: none;"></div>
            <div id="success-message" class="success" style="display: none;"></div>
            <div class="setup-group">
                <input
                    type="text"
                    id="jwt-token"
                    placeholder="Cole seu JWT Token aqui"
                    style="flex: 2;"
                >
                <input
                    type="text"
                    id="recipient-id"
                    placeholder="ID do Destinatário"
                    style="flex: 1;"
                >
                <button onclick="connectChat()">Conectar</button>
            </div>
        </div>

        <div class="chat-container" id="chat-container" style="display: none;">
            <div class="chat-header">
                <h1>Chat em Tempo Real</h1>
                <div class="connection-status" id="connection-status"></div>
            </div>

            <div class="chat-messages" id="messages"></div>

            <div class="chat-input">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Digite sua mensagem..."
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let currentJwtToken = null;
        let currentRecipientId = null;
        let currentUserId = null;

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successEl = document.getElementById('success-message');
            successEl.textContent = message;
            successEl.style.display = 'block';
            setTimeout(() => {
                successEl.style.display = 'none';
            }, 5000);
        }

        function decodeJwt(token) {
            try {
                const parts = token.split('.');
                if (parts.length !== 3) throw new Error('Invalid token');
                const decoded = JSON.parse(atob(parts[1]));
                return decoded;
            } catch (e) {
                return null;
            }
        }

        function connectChat() {
            const jwtToken = document.getElementById('jwt-token').value;
            const recipientId = document.getElementById('recipient-id').value;

            if (!jwtToken || !recipientId) {
                showError('Por favor, preencha todos os campos');
                return;
            }

            const decoded = decodeJwt(jwtToken);
            if (!decoded || !decoded.sub) {
                showError('JWT Token inválido');
                return;
            }

            currentJwtToken = jwtToken;
            currentRecipientId = recipientId;
            currentUserId = decoded.sub;

            // Conectar WebSocket
            socket = io('http://localhost:5000/chat', {
                auth: {
                    token: jwtToken
                },
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                reconnectionAttempts: 5
            });

            // Event listeners
            socket.on('connect', onConnect);
            socket.on('disconnect', onDisconnect);
            socket.on('message', onMessage);
            socket.on('message_sent', onMessageSent);
            socket.on('message_received', onMessageReceived);
            socket.on('user_typing', onUserTyping);
            socket.on('user_stop_typing', onUserStopTyping);
            socket.on('error', onError);

            showSuccess('Conectando ao chat...');
        }

        function onConnect() {
            console.log('Conectado ao chat');
            document.getElementById('chat-container').style.display = 'flex';
            document.getElementById('connection-status').classList.remove('disconnected');
            showSuccess('Conectado com sucesso!');
            addSystemMessage('Você está conectado ao chat em tempo real');
        }

        function onDisconnect() {
            console.log('Desconectado do chat');
            document.getElementById('connection-status').classList.add('disconnected');
            addSystemMessage('Conexão perdida. Tentando reconectar...');
        }

        function onMessage(data) {
            if (data.type === 'system') {
                addSystemMessage(data.content);
            }
        }

        function onMessageSent(data) {
            addMessage(data, 'sent');
            document.getElementById('message-input').value = '';
        }

        function onMessageReceived(data) {
            addMessage(data, 'received');
        }

        function onUserTyping(data) {
            addTypingIndicator(data.sender_name);
        }

        function onUserStopTyping(data) {
            removeTypingIndicator();
        }

        function onError(data) {
            showError(data.message || 'Erro no chat');
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();

            if (!content || !socket || !socket.connected) {
                showError('Mensagem vazia ou desconectado');
                return;
            }

            socket.emit('message', {
                recipient_id: currentRecipientId,
                content: content
            });

            socket.emit('stop_typing', {
                recipient_id: currentRecipientId
            });
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            } else {
                // Indicador de digitação
                if (socket && socket.connected) {
                    socket.emit('typing', {
                        recipient_id: currentRecipientId
                    });
                }
            }
        }

        function addMessage(data, type) {
            const messagesEl = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;

            const bubbleEl = document.createElement('div');
            bubbleEl.className = 'message-bubble';
            bubbleEl.textContent = data.content || data.message;

            messageEl.appendChild(bubbleEl);
            messagesEl.appendChild(messageEl);

            // Scroll para baixo
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addSystemMessage(text) {
            const messagesEl = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = 'system-message';
            messageEl.textContent = text;
            messagesEl.appendChild(messageEl);

            // Scroll para baixo
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addTypingIndicator(name) {
            removeTypingIndicator();

            const messagesEl = document.getElementById('messages');
            const typingEl = document.createElement('div');
            typingEl.className = 'message received';
            typingEl.id = 'typing-indicator';

            const indicatorEl = document.createElement('div');
            indicatorEl.className = 'typing-indicator';
            indicatorEl.innerHTML = '<span></span><span></span><span></span>';

            typingEl.appendChild(indicatorEl);
            messagesEl.appendChild(typingEl);

            // Scroll para baixo
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeTypingIndicator() {
            const typingEl = document.getElementById('typing-indicator');
            if (typingEl) {
                typingEl.remove();
            }
        }
    </script>
</body>
</html>
