<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - DiscoveryShop</title>
    <link rel="stylesheet" href="../css/modules.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">🛍️ DiscoveryShop</div>
        <button class="back-btn" id="back-btn">
            <span>← Volver</span>
        </button>
        <div class="search-bar">
            <input
                type="text"
                placeholder="Buscar conversaciones..."
                id="search-conversations"
            >
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="notifications-btn" title="Notificaciones">
                🔔
                <span class="badge" style="display: none;">0</span>
            </button>
            <button class="user-btn" id="user-btn">Login</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container-chat">
        <!-- Sidebar: Conversaciones -->
        <aside class="chat-sidebar" id="chat-sidebar">
            <div class="sidebar-header">
                <h3>💬 Conversaciones</h3>
                <button class="btn-nueva-conv" id="btn-nueva-conversacion" title="Nueva conversación">
                    ➕
                </button>
            </div>

            <!-- Filtros de conversaciones -->
            <div class="conv-filters">
                <button class="conv-filter-btn active" data-filter="all">
                    Todas
                </button>
                <button class="conv-filter-btn" data-filter="unread">
                    Sin leer
                </button>
                <button class="conv-filter-btn" data-filter="archived">
                    Archivadas
                </button>
            </div>

            <!-- Lista de conversaciones -->
            <div class="conversaciones-list" id="conversaciones-list">
                <!-- Conversaciones se cargarán aquí -->
            </div>

            <!-- Empty state -->
            <div class="empty-state-sidebar" id="empty-conversations" style="display: none;">
                <div class="empty-icon">💭</div>
                <p>Sin conversaciones</p>
            </div>

            <!-- Loading state -->
            <div class="loading-spinner-sidebar" id="loading-conversations" style="display: none;">
                <div class="spinner-small"></div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <section class="chat-main" id="chat-main" style="display: none;">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="chat-user-info">
                    <div class="avatar-large" id="chat-user-avatar"></div>
                    <div class="user-details">
                        <h2 id="chat-user-nombre"></h2>
                        <div class="user-status">
                            <span class="status-indicator" id="status-indicator"></span>
                            <span id="status-text">Offline</span>
                        </div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="icon-btn" id="btn-info-chat" title="Información">
                        ℹ️
                    </button>
                    <button class="icon-btn" id="btn-archivo-chat" title="Compartir archivo">
                        📎
                    </button>
                    <button class="icon-btn" id="btn-cerrar-chat" title="Cerrar">
                        ✕
                    </button>
                </div>
            </div>

            <!-- Messages Container -->
            <div class="messages-container" id="messages-container">
                <!-- Mensajes se cargarán aquí -->
            </div>

            <!-- Loading indicator -->
            <div class="loading-messages" id="loading-messages" style="display: none;">
                <div class="spinner"></div>
                <p>Cargando mensajes...</p>
            </div>

            <!-- Typing indicator -->
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <span id="typing-user-name"></span> está escribiendo
                <span class="dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
            </div>

            <!-- Message Input Area -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <button class="btn-attach" id="btn-attach-file" title="Adjuntar archivo">
                        📎
                    </button>
                    <input
                        type="text"
                        id="message-input"
                        placeholder="Escribe un mensaje..."
                        maxlength="5000"
                        autocomplete="off"
                    >
                    <div class="input-counter">
                        <span id="message-char-count">0</span>/5000
                    </div>
                    <button class="btn-send" id="btn-send-message" title="Enviar">
                        ✈️
                    </button>
                </div>
                <div class="input-actions">
                    <small id="attachment-info" style="display: none;"></small>
                </div>
            </div>
        </section>

        <!-- Empty State: No Conversation Selected -->
        <section class="chat-empty" id="chat-empty">
            <div class="empty-center">
                <div class="empty-icon-large">💬</div>
                <h2>Selecciona una conversación</h2>
                <p>Abre una conversación existente o inicia una nueva</p>
                <button class="btn-primary" id="btn-start-chat">
                    ➕ Nueva Conversación
                </button>
            </div>
        </section>
    </div>

    <!-- Modal: Nueva Conversación -->
    <div class="modal" id="modal-nueva-conversacion" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nueva Conversación</h2>
                <button class="modal-close" id="modal-close-nueva-conv">✕</button>
            </div>
            <div class="modal-body">
                <form id="form-nueva-conversacion">
                    <div class="form-group">
                        <label for="select-usuario">Selecciona un usuario</label>
                        <div class="select-wrapper">
                            <input
                                type="text"
                                id="search-usuario"
                                placeholder="Buscar usuario por nombre..."
                                class="search-input"
                            >
                            <div class="usuarios-dropdown" id="usuarios-dropdown" style="display: none;">
                                <!-- Usuarios se cargarán aquí -->
                            </div>
                        </div>
                        <input type="hidden" id="selected-usuario-id">
                    </div>

                    <div class="selected-usuario" id="selected-usuario-display" style="display: none;">
                        <div class="usuario-badge">
                            <span class="avatar-small" id="selected-usuario-avatar"></span>
                            <span id="selected-usuario-nombre"></span>
                            <button type="button" class="btn-remove-user" id="btn-remove-selected-user">
                                ✕
                            </button>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn-primary" id="btn-iniciar-conversacion">
                            Iniciar Conversación
                        </button>
                        <button type="button" class="btn-secondary" id="form-cancel">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Info Conversación -->
    <div class="modal" id="modal-info-conversacion" style="display: none;">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Información de Conversación</h2>
                <button class="modal-close" id="modal-close-info">✕</button>
            </div>
            <div class="modal-body">
                <div class="info-item">
                    <span class="label">Iniciada:</span>
                    <span id="info-fecha-inicio"></span>
                </div>
                <div class="info-item">
                    <span class="label">Mensajes:</span>
                    <span id="info-total-mensajes">0</span>
                </div>
                <div class="info-item">
                    <span class="label">Último mensaje:</span>
                    <span id="info-ultimo-mensaje"></span>
                </div>
                <div class="info-actions">
                    <button class="btn-secondary" id="btn-archivar-conv">
                        📦 Archivar
                    </button>
                    <button class="btn-danger" id="btn-eliminar-conv">
                        🗑️ Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- File Input (hidden) -->
    <input type="file" id="file-input" style="display: none;">

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/chat.js"></script>
</body>
</html>
