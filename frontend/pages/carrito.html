<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - DiscoveryShop</title>
    <link rel="stylesheet" href="../css/modules.css">
    <style>
        .carrito-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .carrito-items {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .carrito-vacio {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }

        .carrito-vacio-icono {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .carrito-item {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 16px;
            align-items: center;
            background: var(--bg-primary);
        }

        .carrito-item-imagen {
            width: 100px;
            height: 100px;
            border-radius: 4px;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .carrito-item-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carrito-item-info h4 {
            margin: 0 0 8px 0;
            font-size: 16px;
        }

        .carrito-item-vendedor {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .carrito-item-precio {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .carrito-item-controles {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .cantidad-control {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .cantidad-control button {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .cantidad-control button:hover {
            background: var(--bg-tertiary);
        }

        .cantidad-control input {
            width: 48px;
            border: none;
            text-align: center;
            font-size: 14px;
            background: transparent;
        }

        .carrito-item-acciones {
            display: flex;
            gap: 8px;
            font-size: 12px;
        }

        .carrito-item-acciones button {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            text-decoration: underline;
            transition: opacity 0.2s;
        }

        .carrito-item-acciones button:hover {
            opacity: 0.8;
        }

        .carrito-resumen {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 24px;
        }

        .resumen-titulo {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .resumen-fila {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .resumen-fila.total {
            font-weight: bold;
            font-size: 16px;
            border-top: 2px solid var(--border-color);
            padding-top: 12px;
            margin-top: 12px;
        }

        .resumen-acciones {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-comprar {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-comprar:hover {
            background: var(--primary-hover);
        }

        .btn-comprar:disabled {
            background: var(--bg-tertiary);
            cursor: not-allowed;
            color: var(--text-secondary);
        }

        .btn-continuar-compra {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-continuar-compra:hover {
            background: var(--border-color);
        }

        .carrito-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        .carrito-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .carrito-header .items-count {
            background: var(--primary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-limpiar-carrito {
            background: none;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-limpiar-carrito:hover {
            background: var(--danger-color);
            color: white;
        }

        .carrito-item-total {
            font-weight: bold;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .carrito-container {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .carrito-resumen {
                position: static;
            }

            .carrito-item {
                grid-template-columns: 80px 1fr;
                gap: 12px;
            }

            .carrito-item-imagen {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <button class="back-btn" id="back-btn">
            <span>← Volver</span>
        </button>
        <div class="logo">🛍️ DiscoveryShop</div>
        <div class="header-actions">
            <button class="user-btn" id="user-btn">Login</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <section class="feed" style="flex: 1;">
            <div class="carrito-container">
                <!-- Carrito Items -->
                <div class="carrito-items">
                    <div class="carrito-header">
                        <h1>Mi Carrito</h1>
                        <span class="items-count" id="items-count">0 productos</span>
                    </div>

                    <div id="carrito-vacio" class="carrito-vacio" style="display: none;">
                        <div class="carrito-vacio-icono">🛒</div>
                        <h3>Tu carrito está vacío</h3>
                        <p>Explora nuestros productos y agrega algunos a tu carrito</p>
                        <button class="btn-continuar-compra" onclick="window.history.back()">
                            Continuar comprando
                        </button>
                    </div>

                    <div id="carrito-items-lista"></div>
                </div>

                <!-- Carrito Summary -->
                <div class="carrito-resumen">
                    <div class="resumen-titulo">Resumen</div>

                    <div class="resumen-fila">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                    </div>

                    <div class="resumen-fila">
                        <span>Envío estimado</span>
                        <span id="envio">$0.00</span>
                    </div>

                    <div class="resumen-fila">
                        <label>
                            <input type="checkbox" id="descuento-checkbox">
                            <span>Aplicar cupón</span>
                        </label>
                    </div>

                    <div id="descuento-campo" style="display: none; margin: 12px 0;">
                        <input
                            type="text"
                            id="codigo-descuento"
                            placeholder="Código descuento"
                            style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;"
                        >
                        <button onclick="aplicarDescuento()" style="width: 100%; margin-top: 8px; padding: 8px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer;">
                            Aplicar
                        </button>
                    </div>

                    <div class="resumen-fila">
                        <span>Descuento</span>
                        <span id="descuento">$0.00</span>
                    </div>

                    <div class="resumen-fila total">
                        <span>Total</span>
                        <span id="total">$0.00</span>
                    </div>

                    <div class="resumen-acciones">
                        <button class="btn-comprar" id="btn-checkout" disabled>
                            Proceder al Pago
                        </button>
                        <button class="btn-continuar-compra" onclick="window.history.back()">
                            Continuar Comprando
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { Config, ApiEndpoints } from '../js/config.js';

        class CarritoManager {
            constructor() {
                this.items = [];
                this.descuento = 0;
                this.envio = 0;
                this.init();
            }

            init() {
                this.cargarCarrito();
                this.renderizar();
                this.attachEventos();
                this.actualizarResumen();
            }

            cargarCarrito() {
                // Intentar cargar desde API primero
                this.cargarDelBackend();
            }

            async cargarDelBackend() {
                try {
                    const user = Config.getUser();
                    if (!user) {
                        this.items = [];
                        this.renderizar();
                        return;
                    }

                    const response = await Config.fetch(ApiEndpoints.cart.get);
                    if (response.success && response.data && response.data.items) {
                        this.items = response.data.items.map(item => ({
                            productId: item.product_id,
                            titulo: item.product_title,
                            precio: parseFloat(item.price),
                            cantidad: item.quantity,
                            imagen: item.image_url,
                            vendedor: 'DiscoveryShop'
                        }));
                    }
                } catch (error) {
                    console.error('Error cargando carrito:', error);
                    this.items = [];
                }

                this.renderizar();
                this.actualizarResumen();
            }

            renderizar() {
                const lista = document.getElementById('carrito-items-lista');
                const vacio = document.getElementById('carrito-vacio');
                const itemsCount = document.getElementById('items-count');

                if (this.items.length === 0) {
                    lista.innerHTML = '';
                    vacio.style.display = 'block';
                    itemsCount.textContent = '0 productos';
                    return;
                }

                vacio.style.display = 'none';
                const totalItems = this.items.reduce((sum, item) => sum + item.cantidad, 0);
                itemsCount.textContent = `${totalItems} ${totalItems === 1 ? 'producto' : 'productos'}`;

                lista.innerHTML = this.items.map(item => `
                    <div class="carrito-item" data-product-id="${item.productId}">
                        <div class="carrito-item-imagen">
                            <img src="${item.imagen || '/placeholder.jpg'}" alt="${item.titulo}" onerror="this.src='/placeholder.jpg'">
                        </div>
                        <div class="carrito-item-info">
                            <h4>${item.titulo}</h4>
                            <div class="carrito-item-vendedor">Vendedor: ${item.vendedor}</div>
                            <div class="carrito-item-precio">$${item.precio.toFixed(2)}</div>
                            <div class="carrito-item-controles">
                                <div class="cantidad-control">
                                    <button onclick="carritoManager.decrementarCantidad('${item.productId}')">−</button>
                                    <input type="number" value="${item.cantidad}" min="1" max="999" readonly>
                                    <button onclick="carritoManager.incrementarCantidad('${item.productId}')">+</button>
                                </div>
                            </div>
                            <div class="carrito-item-acciones">
                                <button onclick="carritoManager.eliminarItem('${item.productId}')">Eliminar</button>
                            </div>
                            <div class="carrito-item-total">
                                Subtotal: $${(item.precio * item.cantidad).toFixed(2)}
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            incrementarCantidad(productId) {
                const item = this.items.find(i => i.productId === productId);
                if (item && item.cantidad < 999) {
                    item.cantidad++;
                    this.actualizarEnBackend(productId, item.cantidad);
                }
            }

            decrementarCantidad(productId) {
                const item = this.items.find(i => i.productId === productId);
                if (item && item.cantidad > 1) {
                    item.cantidad--;
                    this.actualizarEnBackend(productId, item.cantidad);
                }
            }

            async actualizarEnBackend(productId, cantidad) {
                try {
                    const response = await Config.fetch(
                        ApiEndpoints.cart.remove(productId).replace('/items/', '').replace(productId, `items/${productId}`),
                        {
                            method: 'PUT',
                            body: JSON.stringify({ quantity: cantidad })
                        }
                    );

                    if (response.success) {
                        this.renderizar();
                        this.actualizarResumen();
                    }
                } catch (error) {
                    console.error('Error actualizando carrito:', error);
                }
            }

            eliminarItem(productId) {
                if (confirm('¿Deseas eliminar este producto del carrito?')) {
                    this.items = this.items.filter(i => i.productId !== productId);
                    this.eliminarDelBackend(productId);
                }
            }

            async eliminarDelBackend(productId) {
                try {
                    const response = await Config.fetch(
                        ApiEndpoints.cart.remove(productId),
                        { method: 'DELETE' }
                    );

                    if (response.success) {
                        this.renderizar();
                        this.actualizarResumen();
                    }
                } catch (error) {
                    console.error('Error eliminando producto:', error);
                }
            }

            actualizarResumen() {
                const subtotal = this.items.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
                const descuento = this.descuento;
                const envio = this.items.length > 0 ? this.envio : 0;
                const total = subtotal - descuento + envio;

                document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
                document.getElementById('envio').textContent = `$${envio.toFixed(2)}`;
                document.getElementById('descuento').textContent = `$${descuento.toFixed(2)}`;
                document.getElementById('total').textContent = `$${Math.max(0, total).toFixed(2)}`;

                const btnCheckout = document.getElementById('btn-checkout');
                btnCheckout.disabled = this.items.length === 0;
            }

            attachEventos() {
                document.getElementById('descuento-checkbox').addEventListener('change', (e) => {
                    document.getElementById('descuento-campo').style.display = e.target.checked ? 'block' : 'none';
                });

                document.getElementById('btn-checkout').addEventListener('click', () => {
                    if (this.items.length > 0) {
                        window.location.href = '/pages/checkout.html';
                    }
                });
            }
        }

        // Inicializar
        window.carritoManager = new CarritoManager();

        // Actualizar resumen cada vez que cambie el carrito
        setInterval(() => carritoManager.actualizarResumen(), 1000);

        // Back button
        document.getElementById('back-btn').addEventListener('click', () => window.history.back());
    </script>
</body>
</html>
