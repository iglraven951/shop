<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DiscoveryShop</title>
    <link rel="stylesheet" href="../css/modules.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-body">
    <!-- Contenedor del formulario de login -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <h1 class="auth-title">🔐 Iniciar Sesión</h1>
                <p class="auth-subtitle">Bienvenido a DiscoveryShop</p>
            </div>

            <!-- Formulario de login -->
            <form id="login-form" class="auth-form" novalidate>
                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="tu@correo.com"
                        required
                        autocomplete="email"
                    />
                    <div class="form-error" id="email-error"></div>
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="password-field">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        />
                        <button
                            type="button"
                            id="toggle-password"
                            class="toggle-password-btn"
                            title="Mostrar/Ocultar contraseña"
                        >
                            👁️
                        </button>
                    </div>
                    <div class="form-error" id="password-error"></div>
                </div>

                <!-- Recordarme -->
                <div class="form-group checkbox">
                    <input
                        type="checkbox"
                        id="remember-me"
                        name="rememberMe"
                        class="form-checkbox"
                    />
                    <label for="remember-me" class="checkbox-label">
                        Recordarme en este dispositivo
                    </label>
                </div>

                <!-- Mensaje de error general -->
                <div class="form-error general-error" id="form-error"></div>

                <!-- Botón de submit -->
                <button type="submit" class="btn btn-primary btn-login" id="submit-btn">
                    Iniciar Sesión
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>¿No tienes cuenta?</span>
            </div>

            <!-- Links -->
            <div class="auth-links">
                <a href="register.html" class="btn btn-secondary btn-full">
                    Crear Nueva Cuenta
                </a>
            </div>

            <!-- Opciones adicionales -->
            <div class="auth-footer">
                <a href="#" class="auth-link" id="forgot-password-link">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>
        </div>

        <!-- Info de desarrollo -->
        <div class="auth-info" id="dev-info">
            <p>💡 <strong>Modo Desarrollo:</strong></p>
            <p>Email: <code>test@example.com</code></p>
            <p>Contraseña: <code>password123</code></p>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Configuración global
        window.config = {
            apiUrl: 'http://localhost:5000/api',
            appName: 'DiscoveryShop',
            debug: true
        };
    </script>
    <script src="../js/auth.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
