<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Productos - DiscoveryShop</title>
    <link rel="stylesheet" href="../css/modules.css">
    <style>
        .productos-container {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .productos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        .productos-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .btn-nuevo-producto {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-nuevo-producto:hover {
            background: var(--primary-hover);
        }

        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .producto-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .producto-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .producto-imagen {
            width: 100%;
            height: 200px;
            background: var(--bg-primary);
            overflow: hidden;
            position: relative;
        }

        .producto-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .producto-status-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .status-approved {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }

        .status-rejected {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .status-archived {
            background: rgba(156, 156, 156, 0.2);
            color: #9c9c9c;
        }

        .producto-info {
            padding: 16px;
        }

        .producto-titulo {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .producto-precio {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .producto-stock {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .producto-acciones {
            display: flex;
            gap: 8px;
        }

        .btn-editar,
        .btn-eliminar {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-editar {
            background: var(--primary-color);
            color: white;
        }

        .btn-editar:hover {
            background: var(--primary-hover);
        }

        .btn-eliminar {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .btn-eliminar:hover {
            background: #f44336;
            color: white;
        }

        .productos-vacio {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }

        .productos-vacio-icono {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .image-upload {
            border: 2px dashed var(--border-color);
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .image-upload:hover {
            border-color: var(--primary-color);
            background: rgba(var(--primary-rgb), 0.05);
        }

        .image-upload input {
            display: none;
        }

        .image-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .image-preview-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 4px;
            overflow: hidden;
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(244, 67, 54, 0.9);
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .btn-cancel {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: var(--bg-tertiary);
        }

        .btn-guardar {
            flex: 1;
            padding: 10px;
            border: none;
            background: var(--primary-color);
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-guardar:hover {
            background: var(--primary-hover);
        }

        .btn-guardar:disabled {
            background: var(--bg-tertiary);
            cursor: not-allowed;
            color: var(--text-secondary);
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
        }

        @media (max-width: 768px) {
            .productos-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .productos-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <button class="back-btn" id="back-btn">
            <span>← Volver</span>
        </button>
        <div class="logo">🛍️ DiscoveryShop</div>
        <div class="header-actions">
            <button class="user-btn" id="user-btn">Login</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <section class="feed" style="flex: 1;">
            <div class="productos-container">
                <!-- Header -->
                <div class="productos-header">
                    <h1>Mis Productos</h1>
                    <button class="btn-nuevo-producto" onclick="abrirFormulario()">
                        + Nuevo Producto
                    </button>
                </div>

                <!-- Productos Grid -->
                <div class="productos-grid" id="productos-grid">
                    <!-- Productos se cargarán aquí -->
                </div>

                <div class="productos-vacio" id="productos-vacio" style="display: none;">
                    <div class="productos-vacio-icono">📦</div>
                    <h3>No tienes productos publicados</h3>
                    <p>Empieza a vender creando tu primer producto</p>
                    <button class="btn-nuevo-producto" onclick="abrirFormulario()" style="margin-top: 16px;">
                        + Crear Producto
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal para crear/editar producto -->
    <div class="modal" id="modal-producto">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-titulo">Nuevo Producto</h2>
                <button class="modal-close" onclick="cerrarFormulario()">×</button>
            </div>

            <div class="success-message" id="success-message">
                Producto guardado exitosamente
            </div>

            <form id="producto-form">
                <div class="form-group">
                    <label for="titulo">Título del Producto *</label>
                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Ejemplo: Laptop HP Pavilion 15.6"
                        required
                        minlength="5"
                        maxlength="255"
                    >
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción *</label>
                    <textarea
                        id="descripcion"
                        name="descripcion"
                        placeholder="Describe detalladamente tu producto..."
                        required
                        minlength="20"
                        maxlength="2000"
                    ></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="categoria">Categoría *</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">Selecciona una categoría</option>
                            <option value="electronics">Electrónica</option>
                            <option value="clothing">Ropa</option>
                            <option value="home">Hogar</option>
                            <option value="sports">Deportes</option>
                            <option value="books">Libros</option>
                            <option value="toys">Juguetes</option>
                            <option value="other">Otros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio *</label>
                        <input
                            type="number"
                            id="precio"
                            name="precio"
                            placeholder="100.00"
                            required
                            step="0.01"
                            min="0.01"
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="stock">Stock *</label>
                        <input
                            type="number"
                            id="stock"
                            name="stock"
                            placeholder="10"
                            required
                            min="0"
                            max="9999"
                        >
                    </div>

                    <div class="form-group">
                        <label for="precio-original">Precio Original (Descuento)</label>
                        <input
                            type="number"
                            id="precio-original"
                            name="precio-original"
                            placeholder="150.00"
                            step="0.01"
                            min="0.01"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="ubicacion">Ubicación (Ciudad)</label>
                    <input
                        type="text"
                        id="ubicacion"
                        name="ubicacion"
                        placeholder="Tu ciudad"
                        maxlength="255"
                    >
                </div>

                <div class="form-group">
                    <label>Imágenes del Producto</label>
                    <div class="image-upload" onclick="document.getElementById('imagen-input').click()">
                        <div>📸 Haz clic para seleccionar imágenes</div>
                        <p style="font-size: 12px; color: var(--text-secondary); margin: 8px 0 0 0;">
                            o arrastra archivos aquí
                        </p>
                        <input
                            type="file"
                            id="imagen-input"
                            accept="image/*"
                            multiple
                            onchange="procesarImagenes(event)"
                        >
                    </div>
                    <div class="image-preview" id="image-preview"></div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="cerrarFormulario()">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-guardar" id="btn-guardar">
                        Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { Config, ApiEndpoints } from '../js/config.js';

        // Global state
        let productos = [];
        let productosImagenes = [];
        let productoEnEdicion = null;

        // Initialize
        async function init() {
            await cargarProductos();
        }

        async function cargarProductos() {
            try {
                const response = await Config.fetch('/api/products?role=seller');

                if (response.success && Array.isArray(response.data)) {
                    productos = response.data;
                } else if (response.data && Array.isArray(response.data.items)) {
                    productos = response.data.items;
                } else {
                    productos = [];
                }

                renderProductos();
            } catch (error) {
                console.error('Error cargando productos:', error);
                productos = [];
                renderProductos();
            }
        }

        function renderProductos() {
            const grid = document.getElementById('productos-grid');
            const vacio = document.getElementById('productos-vacio');

            if (productos.length === 0) {
                grid.innerHTML = '';
                vacio.style.display = 'block';
                return;
            }

            vacio.style.display = 'none';
            grid.innerHTML = productos.map(producto => `
                <div class="producto-card">
                    <div class="producto-imagen">
                        <img src="${producto.images?.[0]?.image_url || '/placeholder.jpg'}" alt="${producto.title}" onerror="this.src='/placeholder.jpg'">
                        <span class="producto-status-badge status-${producto.status}">
                            ${translateStatus(producto.status)}
                        </span>
                    </div>
                    <div class="producto-info">
                        <div class="producto-titulo">${producto.title}</div>
                        <div class="producto-precio">$${parseFloat(producto.price).toFixed(2)}</div>
                        <div class="producto-stock">
                            Stock: ${producto.stock} unidad${producto.stock !== 1 ? 'es' : ''}
                        </div>
                        <div class="producto-acciones">
                            <button class="btn-editar" onclick="editarProducto('${producto.id}')">
                                Editar
                            </button>
                            <button class="btn-eliminar" onclick="eliminarProducto('${producto.id}')">
                                Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.abrirFormulario = function() {
            productoEnEdicion = null;
            productosImagenes = [];
            document.getElementById('modal-titulo').textContent = 'Nuevo Producto';
            document.getElementById('producto-form').reset();
            document.getElementById('success-message').style.display = 'none';
            document.getElementById('image-preview').innerHTML = '';
            document.getElementById('modal-producto').classList.add('show');
        };

        window.cerrarFormulario = function() {
            document.getElementById('modal-producto').classList.remove('show');
            productoEnEdicion = null;
            productosImagenes = [];
        };

        async function editarProducto(productoId) {
            try {
                const response = await Config.fetch(`/api/products/${productoId}`);

                if (response.success || response.data) {
                    const producto = response.success ? response.data : response;
                    productoEnEdicion = producto;

                    // Llenar formulario
                    document.getElementById('titulo').value = producto.title || '';
                    document.getElementById('descripcion').value = producto.description || '';
                    document.getElementById('categoria').value = producto.category_id || '';
                    document.getElementById('precio').value = parseFloat(producto.price) || '';
                    document.getElementById('stock').value = producto.stock || '';
                    document.getElementById('precio-original').value = parseFloat(producto.original_price) || '';
                    document.getElementById('ubicacion').value = producto.location || '';

                    // Cargar imágenes
                    productosImagenes = (producto.images || []).map(img => ({
                        url: img.image_url,
                        existente: true
                    }));

                    renderImagenPreview();

                    document.getElementById('modal-titulo').textContent = 'Editar Producto';
                    document.getElementById('modal-producto').classList.add('show');
                }
            } catch (error) {
                console.error('Error cargando producto:', error);
                alert('Error cargando el producto');
            }
        }

        window.procesarImagenes = function(event) {
            const files = Array.from(event.target.files);

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    productosImagenes.push({
                        url: e.target.result,
                        file: file,
                        existente: false
                    });
                    renderImagenPreview();
                };
                reader.readAsDataURL(file);
            });
        };

        function renderImagenPreview() {
            const preview = document.getElementById('image-preview');
            preview.innerHTML = productosImagenes.map((img, idx) => `
                <div class="image-preview-item">
                    <img src="${img.url}" alt="Preview">
                    <button type="button" class="image-preview-remove" onclick="removeImage(${idx})">×</button>
                </div>
            `).join('');
        }

        window.removeImage = function(idx) {
            productosImagenes.splice(idx, 1);
            renderImagenPreview();
        };

        document.getElementById('producto-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const titulo = document.getElementById('titulo').value;
            const descripcion = document.getElementById('descripcion').value;
            const categoria = document.getElementById('categoria').value;
            const precio = parseFloat(document.getElementById('precio').value);
            const stock = parseInt(document.getElementById('stock').value);

            if (!titulo || !descripcion || !categoria || !precio || stock < 0) {
                alert('Por favor completa todos los campos requeridos');
                return;
            }

            try {
                const btnGuardar = document.getElementById('btn-guardar');
                btnGuardar.disabled = true;
                btnGuardar.textContent = 'Guardando...';

                const formData = {
                    title: titulo,
                    description: descripcion,
                    category_id: categoria,
                    price: precio,
                    original_price: parseFloat(document.getElementById('precio-original').value) || null,
                    stock: stock,
                    location: document.getElementById('ubicacion').value
                };

                const endpoint = productoEnEdicion
                    ? `/api/products/${productoEnEdicion.id}`
                    : '/api/products';

                const method = productoEnEdicion ? 'PUT' : 'POST';

                const response = await Config.fetch(endpoint, {
                    method: method,
                    body: JSON.stringify(formData)
                });

                if (response.ok || response.success) {
                    // Mostrar mensaje de éxito
                    const successMsg = document.getElementById('success-message');
                    successMsg.style.display = 'block';

                    setTimeout(() => {
                        cerrarFormulario();
                        cargarProductos();
                    }, 1500);
                } else {
                    const data = await response.json ? response.json() : response;
                    alert(data.message || 'Error guardando el producto');
                }
            } catch (error) {
                console.error('Error guardando producto:', error);
                alert('Error guardando el producto');
            } finally {
                const btnGuardar = document.getElementById('btn-guardar');
                btnGuardar.disabled = false;
                btnGuardar.textContent = 'Guardar Producto';
            }
        });

        async function eliminarProducto(productoId) {
            if (!confirm('¿Estás seguro de que deseas eliminar este producto?')) return;

            try {
                const response = await Config.fetch(`/api/products/${productoId}`, {
                    method: 'DELETE'
                });

                if (response.success || response.ok) {
                    alert('Producto eliminado');
                    cargarProductos();
                } else {
                    alert('Error eliminando el producto');
                }
            } catch (error) {
                console.error('Error eliminando producto:', error);
                alert('Error eliminando el producto');
            }
        }

        function translateStatus(status) {
            const translations = {
                pending: 'Pendiente',
                approved: 'Aprobado',
                rejected: 'Rechazado',
                archived: 'Archivado'
            };
            return translations[status] || status;
        }

        // Initialize
        init();

        // Back button
        document.getElementById('back-btn').addEventListener('click', () => window.history.back());

        // Close modal on outside click
        document.getElementById('modal-producto').addEventListener('click', (e) => {
            if (e.target.id === 'modal-producto') cerrarFormulario();
        });
    </script>
</body>
</html>
