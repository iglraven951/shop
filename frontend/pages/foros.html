<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foros - DiscoveryShop</title>
    <link rel="stylesheet" href="../css/modules.css">
    <link rel="stylesheet" href="../css/foros.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">🛍️ DiscoveryShop</div>
        <button class="back-btn" id="back-btn">
            <span>← Volver</span>
        </button>
        <div class="search-bar">
            <input
                type="text"
                placeholder="Buscar en foros..."
                id="search-input"
            >
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="notifications-btn" title="Notificaciones">
                🔔
                <span class="badge" style="display: none;">0</span>
            </button>
            <button class="user-btn" id="user-btn">Login</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container-foros">
        <!-- Sidebar: Productos -->
        <aside class="foros-sidebar" id="foros-sidebar">
            <div class="sidebar-header">
                <h3>📦 Productos</h3>
            </div>
            <div class="productos-list" id="productos-list">
                <!-- Productos se cargarán aquí -->
            </div>
        </aside>

        <!-- Main Feed: Temas de Discusión -->
        <section class="foros-feed" id="foros-feed">
            <!-- Header del Foro -->
            <div class="foro-header">
                <div class="foro-info">
                    <div class="producto-badge" id="producto-badge">
                        <span id="badge-nombre">Selecciona un producto</span>
                    </div>
                    <h1 id="foro-titulo">Foro del Producto</h1>
                    <p id="foro-descripcion">Discute sobre este producto con otros usuarios</p>
                </div>
                <button class="btn-primary" id="crear-tema-btn" style="display: none;">
                    ➕ Nuevo Tema
                </button>
            </div>

            <!-- Filtros y Ordenamiento -->
            <div class="foro-controles">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="recientes">
                        📅 Más Recientes
                    </button>
                    <button class="filter-tab" data-filter="votados">
                        👍 Más Votados
                    </button>
                    <button class="filter-tab" data-filter="sin-respuesta">
                        ❓ Sin Respuesta
                    </button>
                </div>
            </div>

            <!-- Lista de Temas -->
            <div class="temas-container" id="temas-container">
                <!-- Temas se cargarán aquí -->
            </div>

            <!-- Loading state -->
            <div class="loading-spinner" id="loading-spinner" style="display: none;">
                <div class="spinner"></div>
                <p>Cargando...</p>
            </div>

            <!-- Empty state -->
            <div class="empty-state" id="empty-state" style="display: none;">
                <div class="empty-icon">🏜️</div>
                <h2>No hay temas aún</h2>
                <p>¡Sé el primero en crear un tema de discusión!</p>
            </div>
        </section>

        <!-- Right Panel: Detalles del Tema -->
        <aside class="tema-detail-panel" id="tema-detail-panel" style="display: none;">
            <div class="panel-close-btn" id="panel-close-btn">✕</div>

            <!-- Detalles del Tema -->
            <div class="tema-detail-content" id="tema-detail-content">
                <!-- Encabezado del tema -->
                <div class="tema-header-detail">
                    <h2 id="tema-titulo-detail"></h2>
                    <div class="tema-meta-detail">
                        <span class="autor-info">
                            <span class="autor-avatar" id="autor-avatar"></span>
                            <span id="autor-nombre"></span>
                        </span>
                        <span id="fecha-creation"></span>
                    </div>
                </div>

                <!-- Contenido del tema -->
                <div class="tema-contenido-detail" id="tema-contenido-detail"></div>

                <!-- Stats del tema -->
                <div class="tema-stats">
                    <div class="stat-item">
                        <span class="stat-label">👍 Útil</span>
                        <span class="stat-value" id="votos-util">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">💬 Respuestas</span>
                        <span class="stat-value" id="respuestas-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">👁️ Vistas</span>
                        <span class="stat-value" id="vistas-count">0</span>
                    </div>
                </div>

                <!-- Acciones del tema -->
                <div class="tema-actions">
                    <button class="btn-accion" id="btn-util" data-action="util">
                        👍 Útil
                    </button>
                    <button class="btn-accion" id="btn-no-util" data-action="no-util">
                        👎 No útil
                    </button>
                    <button class="btn-accion" id="btn-responder" data-action="responder">
                        💬 Responder
                    </button>
                </div>

                <!-- Divisor -->
                <div class="divider"></div>

                <!-- Respuestas -->
                <div class="respuestas-section">
                    <h3>Respuestas (<span id="respuestas-num">0</span>)</h3>
                    <div class="respuestas-list" id="respuestas-list">
                        <!-- Respuestas se cargarán aquí -->
                    </div>
                </div>

                <!-- Form para nueva respuesta -->
                <div class="respuesta-form-container" id="respuesta-form-container" style="display: none;">
                    <div class="respuesta-form">
                        <textarea
                            id="respuesta-textarea"
                            placeholder="Escribe tu respuesta aquí..."
                            rows="3"
                        ></textarea>
                        <div class="form-buttons">
                            <button class="btn-primary" id="btn-enviar-respuesta">
                                Enviar Respuesta
                            </button>
                            <button class="btn-secondary" id="btn-cancelar-respuesta">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Modal: Crear Nuevo Tema -->
    <div class="modal" id="modal-crear-tema" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Crear Nuevo Tema</h2>
                <button class="modal-close" id="modal-close-crear">✕</button>
            </div>
            <div class="modal-body">
                <form id="form-crear-tema">
                    <div class="form-group">
                        <label for="tema-titulo-input">Título del Tema</label>
                        <input
                            type="text"
                            id="tema-titulo-input"
                            placeholder="Ej: ¿Cuál es la mejor forma de usar este producto?"
                            maxlength="200"
                            required
                        >
                        <small id="contador-titulo">0/200</small>
                    </div>

                    <div class="form-group">
                        <label for="tema-contenido-input">Descripción</label>
                        <textarea
                            id="tema-contenido-input"
                            placeholder="Describe tu pregunta o comentario en detalle..."
                            rows="6"
                            maxlength="2000"
                            required
                        ></textarea>
                        <small id="contador-contenido">0/2000</small>
                    </div>

                    <div class="form-group">
                        <label for="tema-categoria-select">Categoría</label>
                        <select id="tema-categoria-select" required>
                            <option value="">Selecciona una categoría</option>
                            <option value="pregunta">❓ Pregunta</option>
                            <option value="comentario">💬 Comentario</option>
                            <option value="reseña">⭐ Reseña</option>
                            <option value="problema">⚠️ Problema/Bug</option>
                        </select>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn-primary">
                            Crear Tema
                        </button>
                        <button type="button" class="btn-secondary" id="form-cancel">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/foros.js"></script>
</body>
</html>
