<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Google Maps</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #8b5cf6; }
        #map { width: 100%; height: 400px; border-radius: 8px; margin: 20px 0; border: 1px solid #333; }
        .status { padding: 15px; border-radius: 8px; margin: 10px 0; background: #1a1a1a; border-left: 4px solid #3b82f6; }
        .success { border-left-color: #10b981; color: #d1fae5; }
        .error { border-left-color: #ef4444; color: #fecaca; }
        .warning { border-left-color: #f59e0b; color: #fef3c7; }
        button { padding: 10px 20px; margin: 5px 0; background: #8b5cf6; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #7c3aed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Test de Google Maps</h1>

        <div id="status"></div>
        <button onclick="testGoogleMaps()">Probar Google Maps</button>

        <div id="map"></div>

        <div id="debug" style="margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 8px; max-height: 300px; overflow-y: auto; font-size: 12px; font-family: monospace;"></div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDummyKey&libraries=maps"></script>

    <script>
        const debugLog = [];
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');

        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const fullMsg = `[${timestamp}] ${msg}`;
            debugLog.push({ msg: fullMsg, type });
            debugDiv.innerHTML = debugLog.map(l => `<div style="color: ${l.type === 'error' ? '#ef4444' : l.type === 'success' ? '#10b981' : '#a0a0a0'}">${l.msg}</div>`).join('');
            debugDiv.scrollTop = debugDiv.scrollHeight;
            console.log(fullMsg);
        }

        function updateStatus(msg, type) {
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'warning';
            statusDiv.innerHTML = `<div class="status ${className}">${msg}</div>`;
        }

        function testGoogleMaps() {
            log('🔄 Iniciando test de Google Maps...');

            try {
                // Verificar Google Maps
                if (typeof google === 'undefined') {
                    log('❌ Google object no está disponible', 'error');
                    updateStatus('❌ Google Maps API no cargado', 'error');
                    return;
                }

                if (typeof google.maps === 'undefined') {
                    log('❌ google.maps no está disponible', 'error');
                    updateStatus('❌ Google Maps library no disponible', 'error');
                    return;
                }

                log('✓ Google Maps API disponible', 'success');

                // Coordenadas de Arequipa Centro
                const arequipaCenter = {
                    lat: -16.3972,
                    lng: -71.5350
                };

                log(`🗺️ Creando mapa en coordenadas: ${arequipaCenter.lat}, ${arequipaCenter.lng}`);

                const map = new google.maps.Map(document.getElementById('map'), {
                    zoom: 15,
                    center: arequipaCenter,
                    mapTypeId: google.maps.MapTypeId.ROADMAP,
                    gestureHandling: 'cooperative'
                });

                log('✓ Mapa creado correctamente', 'success');

                // Crear marcador
                const marker = new google.maps.Marker({
                    position: arequipaCenter,
                    map: map,
                    title: 'Arequipa Centro',
                    icon: 'http://maps.google.com/mapfiles/ms/icons/red-dot.png'
                });

                log('✓ Marcador agregado', 'success');

                // Info window
                const infoWindow = new google.maps.InfoWindow({
                    content: `
                        <div style="padding: 10px; color: #333; min-width: 200px;">
                            <div style="font-weight: bold;">📍 Arequipa Centro</div>
                            <div>Arequipa, Perú</div>
                            <div style="font-size: 12px; color: #666; margin-top: 5px;">Ubicación del vendedor</div>
                        </div>
                    `
                });

                marker.addListener('click', () => {
                    infoWindow.open(map, marker);
                });

                infoWindow.open(map, marker);

                log('✓ Info window agregado', 'success');
                updateStatus('✅ Google Maps funcionando correctamente', 'success');

            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
                updateStatus(`❌ Error: ${e.message}`, 'error');
            }
        }

        // Auto-test cuando carga
        window.addEventListener('load', () => {
            log('📍 Página cargada');
            setTimeout(testGoogleMaps, 1000);
        });
    </script>
</body>
</html>
