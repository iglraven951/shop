<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuéntanos qué buscas · DiscoveryShop</title>
    <meta name="description" content="Pide lo que necesitas y deja que las tiendas de Arequipa te respondan. Describe qué buscas, pon tu presupuesto y elige tu distrito en menos de un minuto.">
    <meta name="theme-color" content="#070c14">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="apple-touch-icon" href="assets/img/logo.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/assistant.css">
    <link rel="stylesheet" href="assets/css/pages/publish.css">
    <link rel="stylesheet" href="assets/css/native.css">
</head>
<body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <div id="app-header"></div>

    <main id="main">
        <div class="publish-page">

            <header class="publish-head">
                <p class="publish-eyebrow">
                    <span class="publish-eyebrow-mark" aria-hidden="true"><svg class="brand-svg" viewBox="0 0 40 40" fill="none" aria-hidden="true" focusable="false"><path d="M13.4 10.6 9.1 29.4a1.1 1.1 0 0 0 1.07 1.35h3.23Z" fill="currentColor" opacity="0.5"/><path d="M16.6 11.2V9.4a4.6 4.6 0 0 1 9.2 0v1.8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><mask id="publicar-mark"><rect width="40" height="40" fill="#fff"/><circle cx="21.3" cy="19.4" r="5.2" fill="none" stroke="#000" stroke-width="2.3"/><path d="m25.2 23.3 4.6 4.6" stroke="#000" stroke-width="2.5" stroke-linecap="round"/></mask><path d="M13.4 10.6h15.9a1.6 1.6 0 0 1 1.6 1.45l1.62 17.1a1.6 1.6 0 0 1-1.6 1.75H10.9a1.1 1.1 0 0 1-1.07-1.35Z" fill="currentColor" mask="url(#publicar-mark)"/></svg></span>
                    Comercio inverso · Arequipa
                </p>
                <h1 class="publish-title">Cuéntanos qué buscas</h1>
                <p class="publish-subtitle">
                    Describe lo que necesitas, aunque sea algo muy específico. Cuanto más claro lo
                    expliques, mejores respuestas recibirás. Luego solo espera.
                </p>
            </header>

            <!--
                Aquí se pinta UNA sola cosa: o una pantalla de bloqueo, o el formulario.

                El formulario vive dentro de un <template> y solo se clona cuando la
                sesión confirma que la cuenta puede publicar. El contenido de un
                <template> no forma parte del documento: no se pinta, no recibe foco y
                no aparece en el árbol de accesibilidad. Por eso no se oculta por CSS —
                quien no puede publicar sencillamente no lo tiene.
            -->
            <div class="publish-stage" id="publish-stage">
                <p class="publish-loading" role="status">
                    <span class="spinner" aria-hidden="true"></span>
                    Comprobando los permisos de tu cuenta…
                </p>
            </div>

        </div>
    </main>

    <div id="app-footer"></div>

    <!-- ==================================================================
         Formulario de publicación (solo para vendedores aprobados)
         ================================================================== -->
    <template id="publish-form-template">
        <div class="publish-layout">

            <form class="publish-form" id="publish-form" novalidate>

                <!-- Aviso de borrador recuperado (lo rellena publish.js) -->
                <div id="publish-draft-slot"></div>

                <!-- ---------------- Ayuda de la IA ----------------
                     Lo difícil aquí no es buscar, es explicar qué buscas. Se
                     escribe en una línea y el asistente propone título,
                     categoría, icono y una horquilla de presupuesto sacada de
                     lo que otros han pedido. Todo queda editable: propone,
                     no decide. -->
                <section class="publish-assist" aria-labelledby="assist-title">
                    <div class="publish-assist-head">
                        <span class="publish-assist-icon" aria-hidden="true">✨</span>
                        <div>
                            <h2 class="publish-assist-title" id="assist-title">Dilo con tus palabras</h2>
                            <p class="publish-assist-hint">
                                Escribe lo que buscas en una línea y relleno el formulario por ti.
                            </p>
                        </div>
                    </div>

                    <div class="publish-assist-row">
                        <input class="input" type="text" id="assist-input"
                               placeholder="Busco una lámpara vintage de mesa, dorada, para el escritorio"
                               maxlength="200" autocomplete="off">
                        <button class="btn btn-secondary" type="button" id="assist-run">
                            Rellenar
                        </button>
                    </div>

                    <div class="publish-assist-chips" id="assist-chips" role="group"
                         aria-label="Ejemplos de lo que puedes pedir"></div>

                    <p class="publish-assist-result" id="assist-result" role="status"></p>
                </section>

                <!-- ---------------- 1 · Qué publicas ---------------- -->
                <section class="publish-section">
                    <header class="publish-section-head">
                        <span class="publish-section-step" aria-hidden="true">1</span>
                        <div class="publish-section-text">
                            <h2 class="publish-section-title">Qué buscas</h2>
                            <p class="publish-section-hint">
                                Un título claro y la categoría correcta hacen que te lo encuentren.
                            </p>
                        </div>
                    </header>

                    <div class="publish-section-body">

                        <div class="field">
                            <div class="publish-label-row">
                                <label class="label" for="publish-title">
                                    Título
                                    <span class="required" aria-hidden="true">*</span>
                                    <span class="sr-only">(obligatorio)</span>
                                </label>
                                <span class="publish-counter" id="publish-title-counter" aria-hidden="true">0 / 90</span>
                            </div>
                            <input class="input" type="text" id="publish-title" name="title"
                                   placeholder="Lámpara vintage de mesa"
                                   maxlength="200" autocomplete="off" spellcheck="true"
                                   aria-describedby="publish-title-hint publish-title-error" required>
                            <p class="field-hint" id="publish-title-hint">Entre 4 y 90 caracteres.</p>
                            <p class="field-error" id="publish-title-error" aria-live="polite"></p>
                        </div>

                        <div class="field">
                            <label class="label" for="publish-category">
                                Categoría
                                <span class="required" aria-hidden="true">*</span>
                                <span class="sr-only">(obligatorio)</span>
                            </label>
                            <select class="select" id="publish-category" name="category_id"
                                    aria-describedby="publish-category-hint publish-category-error" required>
                                <option value="">Elige una categoría</option>
                            </select>
                            <p class="field-hint" id="publish-category-hint">
                                Determina el icono por defecto y qué tiendas verán tu pedido.
                            </p>
                            <p class="field-error" id="publish-category-error" aria-live="polite"></p>
                        </div>

                        <fieldset class="publish-fieldset">
                            <legend class="label">
                                ¿En qué estado te sirve?
                                <span class="required" aria-hidden="true">*</span>
                                <span class="sr-only">(obligatorio)</span>
                            </legend>

                            <div class="publish-conditions">
                                <label class="publish-condition">
                                    <input type="radio" name="condition" value="Solo nuevo">
                                    <span class="publish-condition-body">
                                        <span class="publish-condition-name">
                                            <span aria-hidden="true">✨</span> Solo nuevo
                                        </span>
                                        <span class="publish-condition-text">
                                            Sin estrenar, con su caja, etiquetas o precinto original.
                                        </span>
                                    </span>
                                </label>

                                <label class="publish-condition">
                                    <input type="radio" name="condition" value="Como nuevo o mejor">
                                    <span class="publish-condition-body">
                                        <span class="publish-condition-name">
                                            <span aria-hidden="true">👌</span> Como nuevo o mejor
                                        </span>
                                        <span class="publish-condition-text">
                                            Usado poco y sin marcas visibles. Aceptas segunda mano cuidada.
                                        </span>
                                    </span>
                                </label>

                                <label class="publish-condition">
                                    <input type="radio" name="condition" value="Cualquiera que funcione" checked>
                                    <span class="publish-condition-body">
                                        <span class="publish-condition-name">
                                            <span aria-hidden="true">👍</span> Cualquiera que funcione
                                        </span>
                                        <span class="publish-condition-text">
                                            Te da igual que tenga señales de uso mientras cumpla su función.
                                        </span>
                                    </span>
                                </label>
                            </div>
                        </fieldset>

                        <div class="field">
                            <div class="publish-label-row">
                                <span class="label" id="publish-emoji-label">Icono del pedido</span>
                                <span class="publish-counter" id="publish-emoji-current" aria-hidden="true"></span>
                            </div>
                            <!-- Los botones los genera publish.js a partir de una sola lista -->
                            <div class="publish-emoji-grid" id="publish-emoji-grid"
                                 role="radiogroup" aria-labelledby="publish-emoji-label"
                                 aria-describedby="publish-emoji-hint"></div>
                            <p class="field-hint" id="publish-emoji-hint">
                                Se usa como portada de la tarjeta. Si no eliges ninguno, tomamos el de la categoría.
                            </p>
                        </div>

                    </div>
                </section>

                <!-- ---------------- 2 · Descripción ---------------- -->
                <section class="publish-section">
                    <header class="publish-section-head">
                        <span class="publish-section-step" aria-hidden="true">2</span>
                        <div class="publish-section-text">
                            <h2 class="publish-section-title">Descríbelo</h2>
                            <p class="publish-section-hint">
                                Aquí se decide si te escriben o siguen de largo.
                            </p>
                        </div>
                    </header>

                    <div class="publish-section-body">
                        <div class="field">
                            <div class="publish-label-row">
                                <label class="label" for="publish-description">
                                    Cuéntalo con tus palabras
                                    <span class="required" aria-hidden="true">*</span>
                                    <span class="sr-only">(obligatorio)</span>
                                </label>
                                <span class="publish-counter" id="publish-description-counter" aria-hidden="true">0 / 1000</span>
                            </div>
                            <textarea class="textarea publish-textarea" id="publish-description" name="description"
                                      rows="7" maxlength="2000" spellcheck="true"
                                      placeholder="Lo compré hace dos años y lo usé poco. Funciona perfecto, solo tiene un rayón en la base que no se nota. Incluye cargador original y su caja. Lo vendo porque me mudo."
                                      aria-describedby="publish-description-hint publish-description-error" required></textarea>
                            <p class="field-hint" id="publish-description-hint">Entre 20 y 1000 caracteres.</p>
                            <p class="field-error" id="publish-description-error" aria-live="polite"></p>
                        </div>

                        <div class="alert alert-info publish-tips">
                            <span class="alert-icon" aria-hidden="true">💡</span>
                            <div class="alert-content">
                                <p class="alert-title">Tres cosas que siempre conviene decir</p>
                                <ul class="publish-tip-list alert-body">
                                    <li>
                                        <strong>El estado real.</strong> Si tiene un rayón, la batería
                                        rinde menos o falta una pieza, dilo tú antes de que lo pregunten.
                                    </li>
                                    <li>
                                        <strong>Qué incluyes.</strong> Caja, cargador, accesorios,
                                        garantía o comprobante: todo eso sube el valor de tu publicación.
                                    </li>
                                    <li>
                                        <strong>Por qué lo vendes.</strong> «Me mudo», «ya tengo otro»
                                        o «mi hija dejó las clases» dan confianza y evitan sospechas.
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ---------------- 3 · Precio y ubicación ---------------- -->
                <section class="publish-section">
                    <header class="publish-section-head">
                        <span class="publish-section-step" aria-hidden="true">3</span>
                        <div class="publish-section-text">
                            <h2 class="publish-section-title">Presupuesto y zona</h2>
                            <p class="publish-section-hint">
                                Un precio realista y un distrito claro aceleran la venta.
                            </p>
                        </div>
                    </header>

                    <div class="publish-section-body">
                        <div class="publish-row">
                            <div class="field">
                                <label class="label" for="publish-budget-min">
                                    Presupuesto
                                </label>
                                <div class="publish-budget">
                                    <div class="publish-price">
                                        <span class="publish-price-prefix" aria-hidden="true">S/</span>
                                        <input class="input publish-price-input" type="number" id="publish-budget-min"
                                               name="budget_min" min="0" step="1" inputmode="decimal"
                                               placeholder="desde" autocomplete="off"
                                               aria-label="Presupuesto mínimo en soles"
                                               aria-describedby="publish-price-hint publish-price-error">
                                    </div>
                                    <span class="publish-budget-sep" aria-hidden="true">–</span>
                                    <div class="publish-price">
                                        <span class="publish-price-prefix" aria-hidden="true">S/</span>
                                        <input class="input publish-price-input" type="number" id="publish-budget-max"
                                               name="budget_max" min="0" step="1" inputmode="decimal"
                                               placeholder="hasta" autocomplete="off"
                                               aria-label="Presupuesto máximo en soles"
                                               aria-describedby="publish-price-hint publish-price-error">
                                    </div>
                                </div>
                                <p class="field-hint" id="publish-price-hint">
                                    Opcional, pero ayuda: quien tenga lo que buscas sabrá si le encaja.
                                    Puedes dejarlo en blanco si todavía no tienes idea.
                                </p>
                                <p class="field-error" id="publish-price-error" aria-live="polite"></p>
                            </div>

                            <div class="field">
                                <label class="label" for="publish-district">
                                    Distrito
                                    <span class="required" aria-hidden="true">*</span>
                                    <span class="sr-only">(obligatorio)</span>
                                </label>
                                <!-- Las opciones salen de DiscoverySeed.DISTRICTS -->
                                <select class="select" id="publish-district" name="district"
                                        aria-describedby="publish-district-hint publish-district-error" required></select>
                                <p class="field-hint" id="publish-district-hint">
                                    Mostraremos tu distrito en el mapa, no tu dirección exacta.
                                </p>
                                <p class="field-error" id="publish-district-error" aria-live="polite"></p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ---------------- Aviso de moderación y envío ---------------- -->
                <div class="alert alert-warning publish-moderation">
                    <span class="alert-icon" aria-hidden="true">⏳</span>
                    <div class="alert-content">
                        <p class="alert-title">Tu publicación pasa antes por revisión</p>
                        <p class="alert-body">
                            Tu publicación pasará por una revisión rápida del equipo antes de
                            aparecer en el foro. Te avisaremos cuando esté lista.
                        </p>
                    </div>
                </div>

                <div class="publish-actions">
                    <a class="btn btn-ghost" href="index.html" id="publish-cancel">Cancelar</a>
                    <button class="btn btn-primary btn-lg publish-submit" type="submit" id="publish-submit">
                        Publicar artículo
                    </button>
                </div>

            </form>

            <!-- Vista previa en vivo: la misma tarjeta que se ve en el foro -->
            <aside class="publish-preview-col" aria-labelledby="publish-preview-title">
                <div class="publish-preview-sticky">
                    <h2 class="publish-preview-title" id="publish-preview-title">
                        <span aria-hidden="true">👁️</span> Vista previa
                    </h2>
                    <p class="publish-preview-hint">
                        Así se verá tu publicación en el foro. Se actualiza mientras escribes.
                    </p>
                    <div class="publish-preview" id="publish-preview"></div>
                </div>
            </aside>

        </div>
    </template>

    <!-- Núcleo (este orden es obligatorio) -->
    <script src="assets/js/core/config.js"></script>
    <script src="assets/js/core/native.js"></script>
    <script src="assets/js/core/seed.js"></script>
    <script src="assets/js/core/moderator.js"></script>
    <script src="assets/js/core/mock-api.js"></script>
    <script src="assets/js/core/store.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/core/assistant.js"></script>
    <script src="assets/js/ui/toast.js"></script>
    <script src="assets/js/ui/modal.js"></script>
    <script src="assets/js/ui/components.js"></script>
    <script src="assets/js/ui/shell.js"></script>
    <script src="assets/js/ui/assistant-widget.js"></script>
    <!-- Página -->
    <script src="assets/js/pages/publish.js"></script>
</body>
</html>
